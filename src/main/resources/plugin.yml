name: CustomItems
version: "${version}"
main: com.chatbiasa.customitems.CustomItemsPlugin
api-version: "26.2"
description: ItemsAdder-style custom items with auto resource pack hosting.
commands:
  ci:
    description: CustomItems command
    usage: /ci give <item> [player] | /ci spawn <mob> | /ci play <sound> | /ci menu | /ci reload | /ci pack | /ci list
    tab-complete: true
permissions:
  ci.admin:
    default: op

